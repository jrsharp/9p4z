# SMP DFU over BLE GATT - the "traditional" firmware update path
#
# This is the deliberate twin of samples/9p_dfu_l2cap/prj.conf. Diff the two
# files: everything outside the "DFU mechanism" section is held constant, so
# what remains is exactly what each approach costs you.
#
# FAIRNESS NOTE: this is a *tuned* SMP configuration, lifted from Zephyr's own
# samples/subsys/mgmt/mcumgr/smp_svr/overlay-bt.conf -- reassembly on, 2475 B
# netbuf, 498 B ATT MTU, connection-parameter control. An untuned mcumgr build
# would make the comparison a strawman. If SMP loses a number here, it loses it
# configured the way Nordic and the Zephyr project tell you to configure it.

# ========== DFU mechanism: MCUmgr / SMP ==========
# (the 9P twin's counterpart section is NINEP + NINEP_SERVER + NINEP_TRANSPORT_L2CAP
#  + NINEP_DFU + NINEP_GATT_9PIS)
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y

# Command groups. Note that DFU needs BOTH: img for the upload/confirm, os for
# the reset. In the 9P twin these are two files (dev/confirm, dev/reboot) in a
# namespace the client discovers by listing it; here they are two separate
# command groups the client must know the CBOR schema of ahead of time.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# Lets the client query the SMP buffer size instead of guessing it. Required in
# practice for reassembly to be usable.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# --- SMP-over-GATT throughput tuning (per Zephyr smp_svr/overlay-bt.conf) ---
# GATT gives us no transport-level segmentation, so mcumgr does its own:
# reassemble one SMP packet from five 498-byte Write Commands. The 9P twin needs
# none of this -- an L2CAP CoC SDU is segmented by the controller and paced by
# L2CAP credits, below the application entirely.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=6
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
# Request a fast connection interval while SMP commands are in flight. Depends
# on SYSTEM_WORKQUEUE_PRIORITY < 0 (Zephyr default is -1) and on
# BT_GAP_PERIPHERAL_PREF_PARAMS (default y).
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# --- SMP service permissions ---
# IMPORTANT, and a real finding for the talk: MCUMGR_TRANSPORT_BT_PERM defaults
# to RW_AUTHEN whenever BT_SMP=y, i.e. the SMP characteristics demand pairing
# AND authentication before a single DFU byte moves. The 9P/L2CAP twin runs its
# CoC at sec_level L1 with no pairing. We force RW here so the two paths are
# measured over the SAME link security -- otherwise we would be timing a
# pairing dance, not a transport. (Deployments SHOULD use the secure default;
# see doc/DFU_COMPARISON.md, "Security posture", where this cuts for SMP.)
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Device-side DFU instrumentation: gives us start/finish events so the board can
# timestamp the transfer itself, independent of host-side connect overhead. The
# 9P twin gets the same via ninep_dfu's status_cb.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y

# MCUmgr dependencies (9P needs none of these: no CBOR codec, no CRC, no
# separate management buffer pool).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y

# ========== Bluetooth ==========
# Held constant with the 9P twin except for the two protocol-specific lines
# noted below.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SMP DFU"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y

# Security (matched to the 9P twin)
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=3

# BLE buffers - sized for DFU transfers.
# The 9P twin sets ACL RX/TX to 2048 because an L2CAP CoC SDU is reassembled by
# the stack; here the ceiling is the ATT MTU, so 498/502 per Zephyr's own DFU
# overlay is the correct maximum. This asymmetry is not a thumb on the scale --
# it IS the difference being measured.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_CTLR_LE_PING=n

# ========== MCUboot / DFU ==========
# IDENTICAL to the 9P twin.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=n

# Flash buffer - trades RAM for speed
CONFIG_IMG_BLOCK_BUF_SIZE=512

# ========== Flash ==========
# IDENTICAL to the 9P twin.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ========== Networking (required for net_buf) ==========
CONFIG_NETWORKING=y

# ========== Memory ==========
# IDENTICAL to the 9P twin. mcumgr command handlers want a deeper system
# workqueue than the default; that is a real cost of the mechanism, so it is
# recorded here rather than hidden by raising both twins.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Reboot support
CONFIG_REBOOT=y

# ========== Logging ==========
# IDENTICAL to the 9P twin.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Console (can disable for production)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
