# Thingy:91 X — nRF5340 application core.
#
# This file is IDENTICAL in samples/9p_dfu_l2cap and samples/smp_dfu_ble.
# It must stay that way: the board is a control, not a variable.
#
# Console: the board default is already RTT (&rtt0), and we keep it. Do NOT
# move the console to uart0 — on a Thingy:91 X the 5340's uart0 is the
# inter-chip link to the nRF9151, so console traffic would be shouted at the
# other MCU. RTT also keeps the USB device stack out of both images, so the
# flash/RAM delta between the twins is the DFU mechanism and nothing else.
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

# Match the other boards' optimization level so code-size numbers are comparable.
CONFIG_SIZE_OPTIMIZATIONS=y
