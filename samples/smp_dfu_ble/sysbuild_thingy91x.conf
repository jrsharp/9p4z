# Sysbuild fragment for Thingy:91 X (nRF5340).
#
# Pass with -DSB_CONF_FILE=<this file> (it REPLACES sysbuild.conf, so it must
# also carry the MCUboot line). Identical in both DFU twins.
#
# The nRF5340 is dual-core: the application core's Bluetooth host needs a
# controller on the network core, so sysbuild builds ipc_radio as the HCI
# controller image. Without this there is no radio and neither twin advertises.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
